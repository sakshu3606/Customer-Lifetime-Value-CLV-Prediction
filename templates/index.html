<!DOCTYPE html>
<html>
<head>
    <title>CLV Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #222;
            margin-bottom: 30px;
        }

        input[type="file"] {
            padding: 12px;
            background: white;
            border-radius: 6px;
        }

        button {
            padding: 12px 25px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 10px;
        }

        button:hover {
            background: #0056b3;
        }

        table {
            margin: 30px auto;
            border-collapse: collapse;
            width: 90%;
            background: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
        }

        th {
            background: #007bff;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Customer Lifetime Value Prediction</h1>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept=".csv,.xlsx" required>
        <button type="submit">Upload</button>
    </form>

    <div>
        {{ output|safe }}
    </div>

</body>
</html>
